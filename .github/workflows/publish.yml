name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for npm provenance (trusted publishing)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm publishing)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Run type check
        run: bun run typecheck

      - name: Set version to YYYYMMDD-HHmm (GMT+7)
        run: |
          VERSION=$(TZ='Asia/Jakarta' date +"%Y%m%d-%H%M")
          echo "Setting package version to $VERSION"
          npm pkg set version="$VERSION"

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # For Trusted Publishing (OIDC), remove the line above and configure it in npm
          # See: https://docs.npmjs.com/trusted-publishers